[build]
  command = "npm install && npx vite build"
  publish = "dist"
  functions = "netlify/functions"

[build.processing]
  skip_processing = true

[[redirects]]
  from = "/api/portal/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
