[build]
  command = "npm install && cd netlify/functions && npm install && cd ../.. && npx vite build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["tesseract.js"]

[functions."parse-invoice"]
  timeout = 26

[functions."analyze-project"]
  timeout = 26

[functions."analyze-room-photo"]
  timeout = 26

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://js.stripe.com https://api.stripe.com https://api.ksef.mf.gov.pl https://api-test.ksef.mf.gov.pl https://api-demo.ksef.mf.gov.pl; frame-src 'self' blob: https://js.stripe.com https://hooks.stripe.com;"

[[redirects]]
  from = "/api/portal/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/api/stripe/*"
  to = "/.netlify/functions/stripe-:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
