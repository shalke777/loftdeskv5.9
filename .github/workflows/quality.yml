name: Quality gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'netlify/functions/**'
      - 'netlify/edge-functions/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/quality.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Document regression tests
        run: npm run test:documents

      - name: Private automation and PostgreSQL integration tests
        run: npm run test:private

      - name: ChatGPT MCP protocol and OAuth verification tests
        run: npm run test:mcp

      - name: Setup Python for official FA(3) schema validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate generated invoices against official FA(3) XSD
        run: |
          python -m pip install lxml==5.3.2
          node tests/ksef/render-fixtures.mjs /tmp/loftdesk-fa3-fixtures
          python tests/ksef/validate-xsd.py /tmp/loftdesk-fa3-fixtures

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        run: npx playwright test --project=chromium
        env:
          CI: true
